name: Release

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Consumers install this package from the GitHub tag tarball
# (archive/refs/tags/vX.Y.Z.tar.gz), not from npm, so a release tag is
# "published" the moment it exists. This workflow only verifies that the
# tag is sound: version matches, types check, tests pass, package builds.
# There is deliberately no npm publish step -- it required an NPM_TOKEN
# secret nobody had and failed every release at the final step.
jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The tag is the release's source of truth. If it disagrees with
      # package.json, two consumers can resolve the same range to different
      # code -- fail loudly instead of publishing a mislabelled version.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}." >&2
            exit 1
          fi
          echo "Verifying ${PKG_VERSION}"

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build
